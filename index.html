<!DOCTYPE html>
<html lang="ar-IQ" dir="rtl" class="hami-boot-static-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" as="style" href="/hami-home-static-shell.css" />
    <link rel="preload" as="style" href="/hami-boot-shell.css" />
    <style id="hami-splash-critical">
      html,
      body {
        margin: 0;
        background: #0a0f1c;
      }
      #hami-static-boot {
        position: fixed;
        inset: 0;
        z-index: 99990;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1c;
        overflow: hidden;
      }
      .hami-boot-wordmark {
        font-family: system-ui, sans-serif;
        font-size: clamp(2.75rem, 14vw, 4.25rem);
        font-weight: 800;
        letter-spacing: 0.06em;
        line-height: 1;
        color: #e6c673;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }
    </style>
    <script src="/hami-boot.js"></script>
    <link rel="stylesheet" href="/hami-boot-shell.css" />
    <link rel="stylesheet" href="/hami-home-static-shell.css" />
    <title>Hami - Lawyer Dashboard</title>
    <style>
      html,
      body {
        background: var(--hami-board-surface-bg, var(--hami-surface-bg, #0a0f1c));
        color: var(--hami-primary, #e6c673);
        margin: 0;
        min-height: 100%;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="hami-static-boot" data-testid="hami-static-boot" data-hami-phase="splash" aria-hidden="true">
      <span class="hami-boot-wordmark" data-testid="hami-boot-wordmark" aria-hidden="true">حامي</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
