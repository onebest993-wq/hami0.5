<!DOCTYPE html>
<html lang="ar-IQ" dir="rtl" class="hami-boot-static-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="/hami-boot-shell.css" />
    <script>
      (function () {
        if (typeof window === 'undefined' || typeof console === 'undefined') return;
        var benign = [
          /ResizeObserver loop/i,
          /^\[vite\] /i,
          /Download the React DevTools/i,
          /Reduced Motion enabled on your device/i,
          /motion\.dev\/troubleshooting\/reduced-motion/i,
          /\[CursorBrowser\]/i,
          /Native dialog overrides installed/i,
          /\[SecureStore\].*Refused empty overwrite/i,
          /\[KvGuard\]/i,
          /\[Violation\].*non-passive/i,
        ];
        function msg(args) {
          return Array.prototype.slice.call(args).join(' ');
        }
        function patch(level) {
          var native = console[level].bind(console);
          console[level] = function () {
            var t = msg(arguments);
            if (benign.some(function (r) { return r.test(t); })) return;
            native.apply(console, arguments);
          };
        }
        patch('debug');
        patch('info');
        patch('warn');
        patch('log');
        window.addEventListener(
          'error',
          function (e) {
            if (benign.some(function (r) { return r.test(e.message || ''); })) e.preventDefault();
          },
          true,
        );
      })();
    </script>

    <!-- 🔐 WebAuthn Permissions Policy -->
    <meta http-equiv="Permissions-Policy" content="publickey-credentials-get=*, publickey-credentials-create=*" />

    <title>Hami - Lawyer Dashboard</title>
    <style>
      html,
      body {
        background: #05060d;
        color: #e6c673;
        margin: 0;
        min-height: 100%;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div
      id="hami-static-boot"
      data-testid="hami-static-boot"
      aria-busy="true"
      aria-label="تهيئة لوحة المحامي"
    >
      <div class="hami-boot-brand" aria-hidden="true">HAMI</div>
      <header class="hami-boot-header" aria-hidden="true">
        <div class="hami-boot-actions">
          <div class="hami-boot-icon"></div>
          <div class="hami-boot-icon"></div>
          <div class="hami-boot-icon"></div>
        </div>
      </header>
      <main class="hami-boot-main" aria-hidden="true">
        <div class="hami-boot-grid">
          <div class="hami-boot-block hami-boot-block--span2 hami-boot-block--h52"></div>
          <div class="hami-boot-block hami-boot-block--span2 hami-boot-block--h280"></div>
          <div class="hami-boot-block hami-boot-block--span2 hami-boot-block--h180"></div>
          <div class="hami-boot-block hami-boot-block--h120"></div>
          <div class="hami-boot-block hami-boot-block--h120"></div>
        </div>
      </main>
      <div class="hami-boot-status" aria-hidden="true">
        <span class="hami-boot-status-pill">جاري التهيئة…</span>
      </div>
    </div>
    <div id="root"></div>
    <script src="/hami-boot.js" defer></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
