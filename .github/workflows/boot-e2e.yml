name: Boot E2E

# قفل انحدار الإقلاع على Chromium فقط — ليست مصفوفة المحاكيات المحلية.
on:
  pull_request:
    paths:
      - 'public/hami-boot.js'
      - 'e2e/app-boot-smoke.spec.ts'
      - 'e2e/boot-full-path-probe.spec.ts'
      - 'e2e/helpers/bootFixtures.ts'
      - 'scripts/run-boot-e2e.mjs'
      - 'playwright.config.ts'
      - 'src/app/bootstrap/**'
      - 'src/boot/**'
      - '.github/workflows/boot-e2e.yml'
  push:
    branches: [main, master]
    paths:
      - 'public/hami-boot.js'
      - 'e2e/app-boot-smoke.spec.ts'
      - 'e2e/boot-full-path-probe.spec.ts'
      - 'e2e/helpers/bootFixtures.ts'
      - 'scripts/run-boot-e2e.mjs'
      - 'playwright.config.ts'
      - 'src/app/bootstrap/**'
      - 'src/boot/**'
      - '.github/workflows/boot-e2e.yml'
  workflow_dispatch:

concurrency:
  group: boot-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium boot (smoke + probe)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E build
        env:
          VITE_SUPABASE_URL: https://ci-hami-gate.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjaS1oYW1pLWdhdGUifQ.ci-hami-quality-gate-anon-key
          VITE_SHELL_AUTH_OPEN: 'true'
          VITE_BFF_AUTH: 'true'
        run: npm run build:e2e

      - name: Boot E2E
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run test:e2e:boot
