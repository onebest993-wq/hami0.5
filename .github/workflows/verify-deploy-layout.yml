name: Verify deploy layout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require full source tree
        run: |
          test -d src/app || (echo "BLOCKED: src/app missing — do not replace repo with partial GitHub upload" && exit 1)
          test -f scripts/generate-vercel-api.mjs || (echo "BLOCKED: scripts/generate-vercel-api.mjs missing" && exit 1)
          test -f "api/[...slug].ts" || (echo "BLOCKED: api/[...slug].ts missing" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Check (Warning-only - doesn't block build)
        run: npm run typecheck || echo "⚠️ TypeScript check completed with warnings (not blocking build)"

      - name: 📝 ESLint Check (Warning-only - doesn't block build)
        run: npm run lint || echo "⚠️ ESLint check completed with warnings (not blocking build)"

      - name: 🏗️ Verify production build
        run: npm run verify:production-build

      - name: 🧪 Run tests
        run: npm run test:run

      - name: 🔧 Generate Vercel API
        run: node scripts/generate-vercel-api.mjs
