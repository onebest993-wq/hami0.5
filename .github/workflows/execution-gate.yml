name: Execution Gate

# بوابة مستقلة لقسم التنفيذ — تُشغَّل عند تغيير ملفات التنفيذ فقط
# حتى لا تُبطئ كل PR على quality-gate العام.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/app/components/lawyer/ExecutionDashboard/**'
      - 'src/app/application/execution/**'
      - 'e2e/execution*.spec.ts'
      - 'e2e/decisions-storage-persist.spec.ts'
      - 'e2e/helpers/execution*.ts'
      - 'scripts/execution-*.mjs'
      - 'scripts/run-execution-e2e.mjs'
      - '.github/workflows/execution-gate.yml'
  pull_request:
    paths:
      - 'src/app/components/lawyer/ExecutionDashboard/**'
      - 'src/app/application/execution/**'
      - 'e2e/execution*.spec.ts'
      - 'e2e/decisions-storage-persist.spec.ts'
      - 'e2e/helpers/execution*.ts'
      - 'scripts/execution-*.mjs'
      - 'scripts/run-execution-e2e.mjs'
      - '.github/workflows/execution-gate.yml'
  workflow_dispatch:

concurrency:
  group: execution-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Execution production gate
        run: npm run gate:execution
