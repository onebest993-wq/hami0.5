name: Execution Gate

# بوابة مستقلة لقسم التنفيذ — تُشغَّل عند تغيير ملفات التنفيذ فقط
# حتى لا تُبطئ كل PR على quality-gate العام.

# المرشّح كان يغطّي مجلّدين من سطح التنفيذ الحقيقي. الأعطال التي أفلتت في
# ٢٠٢٦-٠٩ وقعت كلها خارجهما: utils/executionFilesStorage.ts (فهرس الملفّات لا
# يُكتب)، infrastructure/execution/ExecutionDossierRepository.ts، و
# ExecutionCreationView (زرّ الحفظ). فحتى مع PR ما كانت هذه البوّابة لتعمل.
#
# القائمة أدناه مستخرَجة من القرص لا من التخمين، والكتلتان متطابقتان عمداً —
# اختلافهما في lawsuits-gate كان يعني سلوكاً مختلفاً بين الدفع وطلب الدمج.
#
# القائمة مكرّرة حرفياً في الكتلتين: GitHub Actions لا يدعم مراسي YAML
# (&anchor / *ref)، فالاختصار بها يكسر الملف صامتاً. أي تعديل هنا يُنسخ هناك.
on:
  # أفرع العمل تُقاس أيضاً — مرشّح المسارات أدناه يبقي التشغيل محصوراً.
  push:
    branches: ['**']
    paths:
      # واجهة التنفيذ
      - 'src/app/components/lawyer/ExecutionDashboard/**'
      - 'src/app/components/lawyer/ExecutionCreationView/**'
      - 'src/app/components/lawyer/execution/**'
      - 'src/app/components/lawyer/View_Urgent_And_Orders_Dashboard/**'
      - 'src/app/components/lawyer/seizedAssetsManager/**'
      # غلافُ القسم ودرعُ نقره (٢٠٢٦-٠٩-١٣): ١١ ملفّاً تحت dashboard/Execution* يستضيف
      # الإضبارةَ والأرشيفَ والإنشاء، والدرعُ فيه كسر هذه البوّابة — ولم يكن شيءٌ منها هنا.
      - 'src/app/components/lawyer/dashboard/Execution*'
      - 'src/app/hooks/useOverlayGhostClickShield.ts'
      # طبقات التنفيذ
      - 'src/app/application/execution/**'
      - 'src/app/domain/execution/**'
      - 'src/app/infrastructure/execution/**'
      - 'src/app/services/execution/**'
      - 'src/app/stores/executionDashboardStore/**'
      - 'src/app/types/execution/**'
      - 'src/app/api/execution-files/**'
      - 'src/app/utils/execution*'
      - 'src/app/utils/executor*'
      - 'src/app/hooks/useLawyerExecutionFiles.ts'
      # نواة التخزين المشتركة — هنا وقع الانحدار الذي أسقط ١٢ ملف اختبار
      - 'src/app/services/SecureStoreService.ts'
      - 'src/app/services/CryptoService.ts'
      - 'src/app/services/dossierPersistence/**'
      - 'src/app/services/storage/**'
      - 'src/app/api/kv-proxy/**'
      # الاختبارات والأدوات والوثائق
      - 'e2e/execution*.spec.ts'
      - 'e2e/decisions-storage-persist.spec.ts'
      - 'e2e/helpers/execution*.ts'
      - 'scripts/execution-*.mjs'
      - 'scripts/run-execution-e2e.mjs'
      # عُدّة E2E المشتركة: تغييرٌ فيها يكسر هذه البوّابة وإن لم يُمسّ التنفيذ.
      - 'playwright.config.ts'
      - 'e2e/globalSetup.ts'
      - 'scripts/e2e-build-env.mjs'
      - 'scripts/run-e2e-build.mjs'
      - 'docs/execution-validation-gate.md'
      - 'execution-coverage-matrix.md'
      - '.github/workflows/execution-gate.yml'
  pull_request:
    paths:
      # واجهة التنفيذ
      - 'src/app/components/lawyer/ExecutionDashboard/**'
      - 'src/app/components/lawyer/ExecutionCreationView/**'
      - 'src/app/components/lawyer/execution/**'
      - 'src/app/components/lawyer/View_Urgent_And_Orders_Dashboard/**'
      - 'src/app/components/lawyer/seizedAssetsManager/**'
      # غلافُ القسم ودرعُ نقره (٢٠٢٦-٠٩-١٣): ١١ ملفّاً تحت dashboard/Execution* يستضيف
      # الإضبارةَ والأرشيفَ والإنشاء، والدرعُ فيه كسر هذه البوّابة — ولم يكن شيءٌ منها هنا.
      - 'src/app/components/lawyer/dashboard/Execution*'
      - 'src/app/hooks/useOverlayGhostClickShield.ts'
      # طبقات التنفيذ
      - 'src/app/application/execution/**'
      - 'src/app/domain/execution/**'
      - 'src/app/infrastructure/execution/**'
      - 'src/app/services/execution/**'
      - 'src/app/stores/executionDashboardStore/**'
      - 'src/app/types/execution/**'
      - 'src/app/api/execution-files/**'
      - 'src/app/utils/execution*'
      - 'src/app/utils/executor*'
      - 'src/app/hooks/useLawyerExecutionFiles.ts'
      # نواة التخزين المشتركة — هنا وقع الانحدار الذي أسقط ١٢ ملف اختبار
      - 'src/app/services/SecureStoreService.ts'
      - 'src/app/services/CryptoService.ts'
      - 'src/app/services/dossierPersistence/**'
      - 'src/app/services/storage/**'
      - 'src/app/api/kv-proxy/**'
      # الاختبارات والأدوات والوثائق
      - 'e2e/execution*.spec.ts'
      - 'e2e/decisions-storage-persist.spec.ts'
      - 'e2e/helpers/execution*.ts'
      - 'scripts/execution-*.mjs'
      - 'scripts/run-execution-e2e.mjs'
      # عُدّة E2E المشتركة: تغييرٌ فيها يكسر هذه البوّابة وإن لم يُمسّ التنفيذ.
      - 'playwright.config.ts'
      - 'e2e/globalSetup.ts'
      - 'scripts/e2e-build-env.mjs'
      - 'scripts/run-e2e-build.mjs'
      - 'docs/execution-validation-gate.md'
      - 'execution-coverage-matrix.md'
      - '.github/workflows/execution-gate.yml'
  workflow_dispatch:

concurrency:
  group: execution-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Execution production gate
        run: npm run gate:execution

      # كانت هذه البوّابة تسقط منذ إنشائها (٨ تشغيلات، صفرُ نجاح) بلا دليلٍ يُقرأ: التعليقات
      # تحمل رسالةَ التوكيد وحدها («element(s) not found»)، **ولا تحمل مخرَجَ المتصفّح**.
      # و`playwright.config.ts` يلتقط لقطةً وفيديو وأثراً عند السقوط — **ثمّ كانت تُرمى**،
      # لأنّ هذه الخطوة لم تكن موجودة. فيبقى الدليلُ سبعةَ أيّام لمن يقرأ الآثار.
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: execution-gate-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
