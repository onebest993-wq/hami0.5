name: Section Gates

# ستّ عشرة بوّابةَ إنتاجٍ مكتوبةً بالكامل لم يكن يستدعيها شيء تلقائياً — لا أمرُ npm
# في سير عمل، ولا غلافٌ موصول: `release:check:*` يستدعي أحد عشر منها ولا سير عملٍ
# يستدعيه، و`run-all-10-section-gates.mjs` يستدعي عشراً ولا أمر npm له. فكانت تعمل
# فقط إن تذكّر إنسانٌ تشغيلها. وهذه هي العلّة نفسها التي كُتب `guard:ci-covers-guards`
# لمنعها، في فضاء أسماءٍ لا يراه: هو يفرضها على `guard:*` وحدها لا على `gate:*`.
#
# **ولا مُشغِّل `push` ولا `pull_request` هنا عمداً.** وصلُ ستّ عشرة بوّابةً — أكثرها
# يبني ويُشغّل Playwright — بكلّ دفعة يضاعف زمنها ويحجب العمل. فالمُشغِّل يدويٌّ
# ومجدوَل: تعمل وتُبلِّغ، ولا تمنع التزاماً واحداً.
#
# ولا `continue-on-error`: ما دامت لا تحجب شيئاً، فإخفاءُ حمرتها خلف أخضرَ كاذب
# يُعيدها إلى ما كانت عليه — مكتوبةً ولا تقول شيئاً. تُترك تصدق.
#
# **ملاحظة تشغيلية تُقال بصراحة:** `schedule` **و**`workflow_dispatch` كلاهما لا يُتاح
# إلا لملفٍّ على الفرع الافتراضي — الجدولُ لا يعمل من فرعٍ جانبيّ، وزرّ التشغيل اليدويّ
# لا يظهر في صفحة Actions أصلاً حتى يصل الملفّ إلى `main`. فهذا الملفّ **ساكنٌ حتى
# يُدمج**، وهذا مقصود: وصلُها الآن بمُشغِّل دفعٍ كان سيُبطئ كلّ التزامٍ في فرع العمل.
#
# ─────────────────────────────────────────────────────────────────────────────
# **قياسُ ٢٠٢٦-٠٩-١٣: شُغّلت الستّ عشرة بالأمر الذي تكتبه المصفوفة حرفاً.**
# النتيجة **١٤ تمرّ · ٢ تسقط** — والادّعاء القائم (F7) كان «ثلاثاً»، فكان خطأً عدداً
# واسماً: `wife` تمرّ في خمس ثوانٍ (فحوصُ بيئتها تشترط `isProd`، والمصفوفة لا تمرّر
# `--prod` ولا يُضبط `NODE_ENV`).
#
# **(١) `operations` — لم تمرّ قطّ ولا تستطيع.** أربعةُ أعطالٍ مستقلّة:
#     • `docs/scalability-reliability.md` — **لا وجود له في تاريخ git كلّه**
#     • `docs/operations-runbook.md`      — كذلك
#     • `npm run typecheck` = `tsc --noEmit` على شفرةٍ خطُّ أساسها **٩٥٦ خطأً** مُسنَّنة
#     • `npm run lint:errors`             — **أمرٌ غير مُعرَّف في `package.json`**
#
# **(٢) `core-boot` — حُسم، ولم يكن حِملَ الجهاز.** أُعيد القياس على جهازٍ ساكن فظهرت
#     عيّناتُ `desktop` متناقصةً اطّراداً: **٦٩٤ → ٣٥٣ → ٣٢٣**، والجوّالُ بعدها — على
#     خادمٍ دافئ — يمرّ مريحاً. **فالعيّنةُ الأولى وحدها تدفع كلفةَ البدء الباردة**،
#     و`p95` على ثلاثٍ هو الأقصى بحكم الحساب. أي أنّ البوّابة كانت تُقايس **بدءاً بارداً
#     بميزانيةِ حالةٍ مستقرّة، فلا تمرّ على أيّ جهاز** — عطلُ قياسٍ لا عطلُ منتج.
#
#     وأُصلح بعيّنةِ إحماءٍ تُهدَر، **بلا مساسٍ بأيّ ميزانية أو إحصاء**:
#         desktop ttfiMs p95: **٦٩٤ ← ٣٦٦**   ·   mobile: ٣٢٣ < ٣٨٠ **صار يمرّ**
#     **ويبقى فرقٌ حقيقيّ صغير** — ١٦م.ث فوق حدّ ٣٥٠ — وعلاجُه تليينُ الإحصاء أو تعديلُ
#     الميزانية، **وكلاهما قرارُ مالك** لا يُؤخذ بلا إذن.
#
# **ولذلك رُفع `schedule` وبقي `workflow_dispatch`:** جدولٌ أسبوعيّ مع بوّابةٍ لا تستطيع
# المرور يعني **أحمرَ دائماً على `main`**، وأحمرُ دائمٍ يُقرأ بعد أسبوعين كخلفيّةٍ لا
# كإنذار — وهو الموت نفسه الذي كُتب هذا الملفّ لإنقاذها منه. **يُعاد الجدول بسطرٍ واحد
# فور خضرة `operations`.**
#
# **وعطلٌ ثالث لا علاقة له بالحمرة، وهو أخطرها:** خمسٌ من الستّ عشرة تُخفي عملها خلف
# أعلام، **والمصفوفة لم تكن تمرّر عَلَماً واحداً** — فبناءُ HQ ومجموعتُه الأمنية
# واختباراتُ التوقيع في `wife` لا تعمل، والوظيفة تخضرّ. **وصفرُ ثانيةٍ في
# `auth-onboarding` و`headquarters` لم تكن سرعة، بل برهانَ أنّ شيئاً لم يُشغَّل.**
#
# **وقِيس كلُّ عَلَمٍ قبل تمريره — لا يُضاف عَلَمٌ لم يُشغَّل:**
#
#     npm run gate:hq -- --tests                  →  PASS   ٩ث
#     npm run gate:hq -- --tests --build          →  PASS  ١٣ث  (والبناء عمل فعلاً)
#     npm run gate:wife-production -- --tests     →  PASS  ٣٢ث
#     npm run gate:auth-onboarding -- --tests     →  **FAIL** ٢٦ث
#
# **فمُرّرت الثلاثة الناجحة، وامتنع الرابع بسببٍ مقيس لا بحدس:** سقوطُ
# `auth-onboarding` اختبارٌ **واحد** من ٥٨ في `adversarialAssault.test.ts`، واسمه
# «WAVE K — … السجل المحلي pending يتقدّم على app_metadata rejected البالي» — **وهو
# بنصّه أوّلُ مدخلٍ في `.audit/test-ratchet-baseline.json`**. أي أنّه فشلٌ **مقبولٌ
# رسمياً** في هذا المستودع.
#
# **والعلّة إذن في البوّابة لا في الشفرة:** هذه البوّابات تستدعي `vitest` مباشرةً، فلا
# تعرف المِسنَنة ولا تحتمل فشلاً مقبولاً. **فتمريرُ `--tests` هنا كان سيُنتج أحمر على
# خطأٍ وافق عليه المستودع** — وإصلاحُه أن تقرأ البوّابةُ خطَّ الأساس، وذلك عملٌ مستقلّ
# لا عَلَمٌ يُضاف.
#
# ويبقى `--live` (يمسّ خدماتٍ حقيقية) و`--prod` (يطلب أسرار إنتاج) خارج العدّاء بحكم
# التصميم — فـ`notifications` و`operations` لا عَلَمَ آمناً لهما أصلاً.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: section-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.section }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: auth-onboarding
            run: npm run gate:auth-onboarding
          - section: calendar
            run: npm run gate:calendar
          - section: core-boot
            run: node scripts/core-boot-production-gate.mjs
          - section: forum
            run: npm run gate:forum
          - section: global-search
            run: npm run gate:global-search
          # ‏`--tests --build` مقيسان أعلاه: PASS في ١٣ث، والبناء يعمل فعلاً.
          - section: headquarters
            run: npm run gate:hq -- --tests --build
          - section: home-hub
            run: npm run gate:homeHub
          - section: legal
            run: npm run gate:legal
          - section: litigation
            run: node scripts/litigation-production-gate.mjs
          - section: notifications
            run: npm run gate:notifications
          - section: operations
            run: node scripts/operations-production-gate.mjs
          - section: profile
            run: npm run gate:profile
          - section: repository
            run: npm run gate:repository
          - section: settings
            run: npm run gate:settings
          - section: tasks
            run: npm run gate:tasks
          # ‏`--tests` مقيس أعلاه: PASS في ٣٢ث — يُشغّل مجموعة التوقيع وCSRF فعلاً.
          - section: wife
            run: npm run gate:wife-production -- --tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # يُثبَّت للجميع بلا تمييز: بوّابةٌ تحتاجه ولا تجده تسقط سقوطاً كاذباً،
      # وتمييزُ من يحتاجه يتقادم صامتاً مع كلّ تعديلٍ في مشغّلات البوّابات.
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: ${{ matrix.section }} production gate
        run: ${{ matrix.run }}
