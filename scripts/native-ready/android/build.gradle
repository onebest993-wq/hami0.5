/*
 * مصدر الحقيقة لملف البناء الجذري — ينسخه `npm run cap:apply:android`.
 *
 * AGP 9.3.1 + Gradle 9.5.1 + Capacitor 8.5 + Kotlin 2.3 (Compose في :app فقط).
 * Gradle Wrapper مثبَّت على 9.5.1 — لا ترفعه إلى 9.6+ حتى يُعلَن التوافق رسمياً.
 */
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

import org.gradle.api.artifacts.repositories.FlatDirectoryArtifactRepository

/*
 * Capacitor 8 يفرض sourceCompatibility 21. foojay-resolver ينزّل JDK 21 تلقائياً.
 */
subprojects { subproject ->
    subproject.tasks.withType(JavaCompile).configureEach {
        javaCompiler = subproject.javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    /*
     * `cap sync` يُعيد flatDir في cordova-plugins رغم أن JARs تُحمَّل عبر fileTree.
     */
    subproject.afterEvaluate {
        subproject.repositories.removeAll { it instanceof FlatDirectoryArtifactRepository }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
