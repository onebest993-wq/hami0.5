plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

/*
 * توقيع الإصدار.
 *
 * بلا هذا لا يُنتج Gradle إلا `app-release-unsigned.apk` — لا يُثبَّت على جهاز
 * ولا يُرفع إلى متجر. أي أن نسخة الإصدار كانت غير قابلة للاختبار على هاتف أصلاً.
 *
 * المخزن نفسه لا يدخل المستودع أبداً ولا يُنشئه أحد نيابةً عن صاحب التطبيق:
 * فقدانه يعني استحالة نشر أي تحديث لاحق للتطبيق نفسه إلى الأبد، وتسريبه يعني
 * أن أي طرف ينشر تحديثاً «موقَّعاً» لتطبيق محاماة. لذلك تُقرأ الهوية من
 * `keystore.properties` (مُتجاهَل في git) أو من البيئة لبناء CI.
 *
 * وغيابه لا يوقف البناء: تبقى مخرجات التنقيح وغير الموقَّعة كما هي اليوم، فلا
 * تتعطّل أي دورة عمل قائمة.
 *
 * keystore.properties:
 *     storeFile=C:/path/to/hami-release.jks
 *     storePassword=…
 *     keyAlias=hami
 *     keyPassword=…
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = false

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseKeystore = keystoreProperties['storeFile'] != null
} else if (System.getenv('HAMI_KEYSTORE_PATH')) {
    keystoreProperties['storeFile'] = System.getenv('HAMI_KEYSTORE_PATH')
    keystoreProperties['storePassword'] = System.getenv('HAMI_KEYSTORE_PASSWORD')
    keystoreProperties['keyAlias'] = System.getenv('HAMI_KEY_ALIAS')
    keystoreProperties['keyPassword'] = System.getenv('HAMI_KEY_PASSWORD')
    hasReleaseKeystore = true
}

if (!hasReleaseKeystore) {
    logger.lifecycle(
        '[hami] لا مخزن توقيع — مخرَج الإصدار سيكون app-release-unsigned.apk ' +
        '(لا يُثبَّت على جهاز ولا يُرفع إلى متجر). ' +
        'أنشئ keystore.properties أو اضبط HAMI_KEYSTORE_PATH.'
    )
}

android {
    namespace = "iq.hami.legal"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "iq.hami.legal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100500
        versionName "10.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                /* v1 لأجل minSdk 24، وv2/v3 لسلامة التحقّق على أندرويد الحديث */
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose = true
        resValues = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}
composeCompiler {
    includeComposeMappingFile = true
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'compose-group-mapping') {
            details.useVersion '2.3.10'
            details.because 'compose-group-mapping 2.2.10 was never published; align with Kotlin Compose plugin'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    implementation platform('androidx.compose:compose-bom:2025.01.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
