  <body>
    <div id="loading-overlay">
        <span class="loader"></span>
        <p style="margin-top: 20px; font-family: monospace;">Loading System...</p>
    </div>
    <div id="root"></div>
    <script>
      // 🛡️ Remove loader when React mounts
      window.removeLoader = function() {
        var loader = document.getElementById('loading-overlay');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
        }
      };
      
      // 🛡️ Global Error Catcher (DOM APIs + textContent — avoid XSS via error message)
      window.onerror = function(msg, url, line) {
        var loader = document.getElementById('loading-overlay');
        if (loader) {
          while (loader.firstChild) loader.removeChild(loader.firstChild);
          var h1 = document.createElement('h1');
          h1.style.color = 'red';
          h1.textContent = 'System Error';
          var pre = document.createElement('pre');
          pre.style.color = 'white';
          pre.style.textAlign = 'left';
          pre.style.background = '#111';
          pre.style.padding = '10px';
          var lines = [];
          if (msg != null) lines.push(String(msg));
          if (url != null) lines.push(String(url));
          if (line != null) lines.push(String(line));
          pre.textContent = lines.join('\n');
          var btn = document.createElement('button');
          btn.textContent = 'Reload';
          btn.onclick = function() { location.reload(); };
          loader.appendChild(h1);
          loader.appendChild(pre);
          loader.appendChild(btn);
        }
      };
      
      // إزالة شاشة التحميل فور جاهزية DOM
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          if (typeof window.removeLoader === 'function') window.removeLoader();
        }, 80);
      });

      // عند Refresh من ذاكرة المتصفح (bfcache)
      window.addEventListener('pageshow', function() {
        if (typeof window.removeLoader === 'function') window.removeLoader();
      });

      // احتياطي — لا تبقى الشاشة السوداء أكثر من 2.5 ثانية
      setTimeout(function() {
        if (typeof window.removeLoader === 'function') {
          window.removeLoader();
          return;
        }
        var loader = document.getElementById('loading-overlay');
        if (loader && loader.parentNode) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.5s';
          setTimeout(function() { loader.remove(); }, 500);
        }
      }, 2500);
    </script>
